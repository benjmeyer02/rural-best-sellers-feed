name: Update homepage Best Sellers feed

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read storefront collection order
        run: python3 scripts/update.py
      - name: Publish validated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add best-sellers.json
          git commit -m 'Update homepage Best Sellers IDs' || exit 0
          git push
